name: Backend CI

on:
  push:
    branches: [ main, 'sprints/**' ]
    paths: [ 'backend/**', '.github/workflows/backend-ci.yml' ]
  pull_request:
    paths: [ 'backend/**', '.github/workflows/backend-ci.yml' ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore backend/AppColoreando.slnx
      - name: Build
        run: dotnet build backend/AppColoreando.slnx -c Release --no-restore --warnaserror
      - name: Test
        run: dotnet test backend/AppColoreando.slnx -c Release --no-build --logger trx
