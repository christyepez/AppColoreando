name: AppColoreando CI

on:
  push:
    branches: [ main, develop/baseline-platform, 'sprints/**' ]
    paths:
      - 'backend/**'
      - 'apps/admin/**'
      - 'services/visual-processor/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'apps/admin/**'
      - 'services/visual-processor/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore backend/AppColoreando.slnx
      - name: Build
        run: dotnet build backend/AppColoreando.slnx -c Release --no-restore --warnaserror
      - name: Test
        run: dotnet test backend/AppColoreando.slnx -c Release --no-build

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - name: Install
        working-directory: apps/admin
        run: npm ci
      - name: Build
        working-directory: apps/admin
        run: npm run build
      - name: Production dependency audit
        working-directory: apps/admin
        run: npm audit --omit=dev --audit-level=moderate

  visual-processor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/visual-processor/requirements.txt
      - name: Install visual processor dependencies
        working-directory: services/visual-processor
        run: pip install -r requirements.txt
      - name: Visual processor tests
        working-directory: services/visual-processor
        run: pytest -q
      - name: Build visual processor image
        run: docker build -t appcoloreando-visual-processor:test services/visual-processor
