name: Backend CI

on:
  push:
    branches: [ main, develop/baseline-platform ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore backend/src/AppColoreando.Api/AppColoreando.Api.csproj
      - name: Build
        run: dotnet build backend/src/AppColoreando.Api/AppColoreando.Api.csproj -c Release --no-restore --warnaserror
